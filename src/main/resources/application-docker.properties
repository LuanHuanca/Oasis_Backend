# Configuración para Docker
# Este archivo usa variables de entorno que se inyectan desde docker-compose.yml

spring.application.name=oasis
# Puerto del servidor
# En Railway: usar ${PORT} (Railway asigna el puerto automáticamente)
# En Docker: usar SERVER_PORT del docker-compose.yml
server.port=${SERVER_PORT:${PORT:9999}}

# Configuración de la base de datos PostgreSQL
# En Railway: usar las variables proporcionadas por Railway
# Railway proporciona automáticamente: PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# IMPORTANTE: En Railway, cuando agregas un servicio PostgreSQL, se crean estas variables automáticamente
# Si Railway proporciona DATABASE_URL (formato: postgresql://user:pass@host:port/db), 
# debes configurar SPRING_DATASOURCE_URL manualmente en formato JDBC: jdbc:postgresql://host:port/db
# Prioridad: SPRING_DATASOURCE_URL > construcción con PGHOST/PGPORT/PGDATABASE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:password}}
# Configuración del pool de conexiones HikariCP para mejorar la estabilidad
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
# Configuración adicional para Railway
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuración de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
# Configuración adicional para mejorar la conexión en Railway
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Configuración de conexión para Railway (evitar timeouts)
spring.jpa.properties.hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider
# Configuración adicional para mejorar la conexión en Railway
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Configuración de conexión para Railway (evitar timeouts)
spring.jpa.properties.hibernate.connection.provider_class=org.hibernate.hikaricp.internal.HikariCPConnectionProvider

# Configuración para envío de correos
# IMPORTANTE: Railway bloquea conexiones SMTP salientes (puertos 25, 587, 465)
# SOLUCIÓN: Usar SendGrid API REST (HTTPS puerto 443) que Railway NO bloquea
# 
# Para Railway (RECOMENDADO):
#   MAIL_PROVIDER=sendgrid
#   SENDGRID_API_KEY=<TU_API_KEY_DE_SENDGRID>
#   SENDGRID_FROM_EMAIL=noreply@tudominio.com
#
# Para desarrollo local con SMTP (NO funciona en Railway):
#   MAIL_PROVIDER=smtp
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=tu-email@gmail.com
#   SPRING_MAIL_PASSWORD=<APP_PASSWORD>

# Proveedor de correo (sendgrid por defecto, o smtp para desarrollo local)
mail.provider=${MAIL_PROVIDER:sendgrid}

# Configuración para SendGrid (API REST - HTTPS) - Funciona en Railway
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}

# Configuración SMTP (solo para desarrollo local, NO funciona en Railway)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.sendpartial=false

# Configuración de zona horaria
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google Generative AI
google.generativeai.api_key=${GOOGLE_GENERATIVEAI_API_KEY:}

# Configuración de CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Spring Actuator - Health checks para Docker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# Configuración de health checks más permisiva
# Si algún componente falla (como mail, etc), no afecta el status general
management.endpoint.health.status.http-mapping.down=200
management.health.defaults.enabled=true

# Deshabilitar health checks de componentes opcionales que pueden fallar
management.health.mail.enabled=false
management.health.diskspace.enabled=false

# Configuración de seguridad - Ocultar información del servidor
# Ocultar header X-Powered-By
server.servlet.context-path=
# Ocultar información del servidor en headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

