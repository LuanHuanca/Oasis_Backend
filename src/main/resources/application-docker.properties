# Configuración para Docker
# Este archivo usa variables de entorno que se inyectan desde docker-compose.yml

spring.application.name=oasis
# Puerto del servidor
# En Railway: usar ${PORT} (Railway asigna el puerto automáticamente)
# En Docker: usar SERVER_PORT del docker-compose.yml
server.port=${SERVER_PORT:${PORT:9999}}

# Configuración de la base de datos PostgreSQL
# En Railway: usar las variables proporcionadas por Railway
# En Docker: usar las variables del docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/oasis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Configuración de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Configuración para utilizar el gmail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuración de zona horaria
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google Generative AI
google.generativeai.api_key=${GOOGLE_GENERATIVEAI_API_KEY:}

# Configuración de CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Spring Actuator - Health checks para Docker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# Configuración de seguridad - Ocultar información del servidor
# Ocultar header X-Powered-By
server.servlet.context-path=
# Ocultar información del servidor en headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
