# Configuración para Docker
# Este archivo usa variables de entorno que se inyectan desde docker-compose.yml

spring.application.name=oasis
# Puerto del servidor
# En Railway: usar ${PORT} (Railway asigna el puerto automáticamente)
# En Docker: usar SERVER_PORT del docker-compose.yml
server.port=${SERVER_PORT:${PORT:9999}}

# Configuración de la base de datos PostgreSQL
# En Railway: usar las variables proporcionadas por Railway
# En Docker: usar las variables del docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://mainline.proxy.rlwy.net:30263/railway}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Configuración de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Configuración para utilizar el gmail
# NOTA: Railway puede bloquear el puerto 587, por lo que se usa 465 (SSL directo) por defecto
# Para usar puerto 587: cambiar SPRING_MAIL_PORT=587 y activar starttls, desactivar ssl
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
# Configuración para puerto 465 (SSL directo) - más compatible con Railway
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
# Timeouts aumentados para Railway (30 segundos) - necesario para conexiones en cloud
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Configuraciones adicionales para mejorar la conexión en entornos cloud
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Configuración para mejorar la conexión en Railway
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Configuración adicional para mejorar la estabilidad de la conexión
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.sendpartial=false

# Configuración de zona horaria
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google Generative AI
google.generativeai.api_key=${GOOGLE_GENERATIVEAI_API_KEY:}

# Configuración de CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Spring Actuator - Health checks para Docker
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# Configuración de health checks más permisiva
# Si algún componente falla (como mail, etc), no afecta el status general
management.endpoint.health.status.http-mapping.down=200
management.health.defaults.enabled=true

# Deshabilitar health checks de componentes opcionales que pueden fallar
management.health.mail.enabled=false
management.health.diskspace.enabled=false

# Configuración de seguridad - Ocultar información del servidor
# Ocultar header X-Powered-By
server.servlet.context-path=
# Ocultar información del servidor en headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
