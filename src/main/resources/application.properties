spring.application.name=oasis

# Puerto del servidor
# Prioridad: SERVER_PORT > PORT (Railway) > 9999 (default)
server.port=${SERVER_PORT:${PORT:9999}}

# Configuración de la base de datos PostgreSQL
# Prioridad: Variables de entorno > valores por defecto (localhost para desarrollo local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oasis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Configuración de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.show-sql=true

# Configuracion para utilizar el gmail
# Prioridad: Variables de entorno > valores por defecto
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:agencia.viajes.oasis@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:auveashvdzrifszk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Configuracion de zona horaria
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración de CORS
# Permite configurar desde variables de entorno (Railway) o usar localhost por defecto
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Google Generative AI
# Prioridad: Variables de entorno > valor por defecto
google.generativeai.api_key=${GOOGLE_GENERATIVEAI_API_KEY:AIzaSyBUsub9sFFCPNi6_ktk3iVZG4gYmXfUvng}
