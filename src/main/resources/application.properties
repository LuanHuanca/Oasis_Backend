spring.application.name=oasis

# Puerto del servidor
# Prioridad: SERVER_PORT > PORT (Railway) > 9999 (default)
server.port=${SERVER_PORT:${PORT:9999}}

# Configuración de la base de datos PostgreSQL
# Prioridad: Variables de entorno > valores por defecto (localhost para desarrollo local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oasis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Configuración de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.show-sql=true

# Configuracion para utilizar el gmail
# Prioridad: Variables de entorno > valores por defecto
# NOTA: Si el puerto 587 no funciona en Railway, cambiar a 465 y usar SSL directo
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=agencia.viajes.oasis@gmail.com
spring.mail.password=auveashvdzrifszk
spring.mail.properties.mail.smtp.auth=true
# Configuración para puerto 587 (STARTTLS)
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Timeouts aumentados para Railway (30 segundos)
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Configuraciones adicionales para mejorar la conexión en entornos cloud
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.socketFactory.port=587
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
# Configuración para mejorar la conexión en Railway
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Configuración adicional para mejorar la estabilidad de la conexión
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.properties.mail.smtp.sendpartial=false

# ============================================
# CONFIGURACIÓN DE SENDGRID (Para Railway y Local)
# ============================================
# Prioridad: Variables de entorno > valores por defecto
# Para desarrollo local, puedes configurar aquí o usar variables de entorno
# mail.provider: sendgrid o smtp
mail.provider=${MAIL_PROVIDER:sendgrid}
# SendGrid API Key (obtener de https://sendgrid.com)
sendgrid.api.key=${SENDGRID_API_KEY:}
# Email verificado en SendGrid (debe ser exactamente el mismo que verificaste)
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}

# Configuracion de zona horaria
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración de CORS
# Permite configurar desde variables de entorno (Railway) o usar localhost por defecto
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Google Generative AI
# Prioridad: Variables de entorno > valor por defecto
google.generativeai.api_key=${GOOGLE_GENERATIVEAI_API_KEY:AIzaSyBUsub9sFFCPNi6_ktk3iVZG4gYmXfUvng}

# Configuración de seguridad - Ocultar información del servidor
# Ocultar header X-Powered-By
server.servlet.context-path=
# Ocultar información del servidor en headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false