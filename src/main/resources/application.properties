spring.application.name=oasis

# Puerto del servidor
# Prioridad: SERVER_PORT > PORT (Railway) > 9999 (default)
server.port=${SERVER_PORT:${PORT:9999}}

# Configuración de la base de datos PostgreSQL
# Prioridad: Variables de entorno > valores por defecto (localhost para desarrollo local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oasis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Configuración de Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.show-sql=true

# Configuracion para utilizar el gmail
# Prioridad: Variables de entorno > valores por defecto
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=agencia.viajes.oasis@gmail.com
spring.mail.password=auveashvdzrifszk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

# Configuracion de zona horaria
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuración de CORS
# Permite configurar desde variables de entorno (Railway) o usar localhost por defecto
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Google Generative AI
# Prioridad: Variables de entorno > valor por defecto
google.generativeai.api_key=${GOOGLE_GENERATIVEAI_API_KEY:AIzaSyBUsub9sFFCPNi6_ktk3iVZG4gYmXfUvng}

# Configuración de seguridad - Ocultar información del servidor
# Ocultar header X-Powered-By
server.servlet.context-path=
# Ocultar información del servidor en headers
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false